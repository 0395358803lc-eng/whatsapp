name: Number checker autoformat

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ci-green-number-checker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Remove lint workaround and refactor XLSX cell parsing
        shell: python
        run: |
          from pathlib import Path

          excel = Path('dashboard/src/utils/excelNumberCheck.ts')
          text = excel.read_text()
          old = """      let value = '';

      if (type === 'inlineStr') {
"""
          new = """      let value: string;

      if (type === 'inlineStr') {
"""
          if old in text:
              text = text.replace(old, new, 1)
              excel.write_text(text)
          elif 'let value: string;' not in text:
              raise SystemExit('Expected XLSX value initialization was not found')

          eslint = Path('dashboard/eslint.config.js')
          config = eslint.read_text()
          workaround = """  {
    files: ['src/utils/excelNumberCheck.ts'],
    rules: {
      // XLSX cells are assigned through multiple mutually-exclusive type branches.
      // Keeping one typed local makes the parser easier to audit than duplicating
      // indexed writes inside every branch.
      'no-useless-assignment': 'off',
    },
  },
"""
          if workaround in config:
              config = config.replace(workaround, '', 1)
              eslint.write_text(config)

      - name: Install dashboard dependencies
        run: cd dashboard && npm ci

      - name: Format exact changed source files
        run: cd dashboard && npx prettier --write src/pages/NumberChecker.tsx src/utils/excelNumberCheck.ts

      - name: Validate lint and formatting
        run: |
          cd dashboard
          npm run lint
          npm run format:check

      - name: Commit formatter output to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dashboard/src/pages/NumberChecker.tsx dashboard/src/utils/excelNumberCheck.ts dashboard/eslint.config.js
          if git diff --cached --quiet; then
            echo 'No formatter changes needed.'
            exit 0
          fi
          git commit -m 'fix(dashboard): clean and format number checker'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
